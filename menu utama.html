<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Menu Utama - Si Perbaiki</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: "Segoe UI", Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      background-color: #f8fafc;
      color: #0f172a;
    }

    /* Navbar / Topbar Rata Kiri */
    .topbar {
      width: 100%;
      min-height: 60px;
      background-color: #000c66;
      color: #ffffff;
      padding: 8px 24px;
      display: flex;
      align-items: center;
      justify-content: flex-start;
      gap: 20px;
    }

    .brand-box {
      display: flex;
      align-items: center;
      justify-content: flex-start;
      gap: 10px;
      min-width: 196px;
      font-size: 18px;
      font-weight: 700;
      color: #ffffff;
      text-decoration: none;
      text-align: left;
    }

    .navbar-logo {
      width: 26px;
      height: 26px;
      object-fit: contain;
      flex-shrink: 0;
    }

    .brand-icon {
      font-size: 18px;
      color: #60a5fa;
      flex-shrink: 0;
    }

    /* Kotak Pencarian Menu */
    .search-box {
      flex: 1;
      max-width: 420px;
      background-color: #ffffff;
      border-radius: 6px;
      padding: 7px 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .search-box i {
      color: #64748b;
      font-size: 13px;
    }

    .search-box input {
      width: 100%;
      border: none;
      outline: none;
      font-size: 13px;
      color: #0f172a;
      background: transparent;
    }

    .topbar-right {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 14px;
      font-size: 14px;
    }

    .admin-profile {
      display: flex;
      align-items: center;
      gap: 6px;
      font-weight: 600;
      font-size: 13px;
    }

    /* Wrapper Utama */
    .dashboard-wrapper {
      flex: 1;
      width: 100%;
      display: flex;
      min-width: 0;
      overflow-x: hidden;
    }

    /* Sidebar */
    .sidebar {
      width: 220px;
      background-color: #000c66;
      color: #ffffff;
      padding: 20px 0;
      flex-shrink: 0;
      border-top: 1px solid rgba(255, 255, 255, 0.12);
    }

    .nav-item {
      display: block;
      padding: 13px 24px;
      color: #e2e8f0;
      text-decoration: none;
      font-size: 14px;
      font-weight: 500;
      text-align: left;
      transition: background-color 0.2s ease, color 0.2s ease;
    }

    .nav-item:hover {
      background-color: rgba(37, 99, 235, 0.45);
      color: #ffffff;
    }

    .nav-item.active {
      background-color: #1d4ed8;
      color: #ffffff;
      font-weight: 600;
    }

    .menu-empty-info {
      display: none;
      padding: 12px 24px;
      font-size: 12px;
      color: #cbd5e1;
    }

    /* Konten Utama */
    .content-area {
      flex: 1;
      min-width: 0;
      background-color: #ffffff;
      padding: 24px 28px;
    }

    .welcome-header {
      margin-bottom: 22px;
    }

    .welcome-header h1 {
      font-size: 24px;
      font-weight: 700;
      color: #0f172a;
      margin-bottom: 4px;
    }

    .welcome-header p {
      font-size: 13px;
      color: #64748b;
    }

    /* 4 Kartu Statistik */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px;
      margin-bottom: 24px;
    }

    .stat-card {
      background-color: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 10px;
      padding: 16px 18px;
      display: flex;
      align-items: center;
      gap: 14px;
      box-shadow: 0 3px 10px rgba(15, 23, 42, 0.04);
    }

    .stat-icon {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background-color: #dbeafe;
      color: #1d4ed8;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      flex-shrink: 0;
    }

    .stat-info {
      min-width: 0;
    }

    .stat-label {
      font-size: 12px;
      font-weight: 600;
      color: #334155;
      margin-bottom: 2px;
    }

    .stat-value {
      font-size: 22px;
      font-weight: 700;
      color: #0f172a;
    }

    /* Grid Grafik */
    .charts-grid {
      display: grid;
      grid-template-columns: 1.2fr 1fr;
      gap: 20px;
      align-items: stretch;
      min-width: 0;
    }

    .chart-card {
      background-color: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 3px 12px rgba(15, 23, 42, 0.05);
      min-width: 0;
      display: flex;
      flex-direction: column;
    }

    .chart-title {
      font-size: 16px;
      font-weight: 700;
      color: #0f172a;
      margin-bottom: 16px;
    }

    .svg-wrapper {
      width: 100%;
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .svg-wrapper svg {
      width: 100%;
      height: auto;
      max-height: 290px;
    }

    .donut-legend {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 14px;
      margin-top: 12px;
      font-size: 12px;
      color: #475569;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .legend-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      display: inline-block;
    }

    /* Footer */
    .footer {
      width: 100%;
      padding: 12px 24px;
      background-color: #ffffff;
      border-top: 1px solid #cbd5e1;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
      color: #475569;
    }

    /* Responsif */
    @media (max-width: 1024px) {
      .stats-grid {
        grid-template-columns: repeat(2, 1fr);
      }

      .charts-grid {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 768px) {
      .topbar {
        flex-wrap: wrap;
        padding: 10px 16px;
        gap: 10px;
      }

      .brand-box {
        min-width: auto;
      }

      .search-box {
        order: 3;
        max-width: 100%;
        width: 100%;
      }

      .dashboard-wrapper {
        flex-direction: column;
      }

      .sidebar {
        width: 100%;
        padding: 8px 12px;
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }

      .nav-item {
        padding: 8px 12px;
        border-radius: 6px;
      }

      .content-area {
        padding: 18px 16px;
      }

      .stats-grid {
        grid-template-columns: 1fr;
      }

      .footer {
        flex-direction: column;
        gap: 6px;
        text-align: center;
      }
    }
  </style>
</head>
<body>
  <!-- Navbar Rata Kiri -->
  <header class="topbar">
    <a href="menu utama.html" class="brand-box">
      <img
        src="logo.png"
        alt="Logo Si Perbaiki"
        class="navbar-logo"
        onerror="this.style.display='none'; this.nextElementSibling.style.display='inline-block';"
      >
      <i class="fa-solid fa-screwdriver-wrench brand-icon" style="display: none;"></i>
      <span>Si Perbaiki</span>
    </a>

    <div class="search-box">
      <i class="fa-solid fa-magnifying-glass"></i>
      <input type="text" id="menuSearchInput" placeholder="Cari menu (contoh: Nota, Keuangan)...">
    </div>

    <div class="topbar-right">
      <i class="fa-solid fa-bell" title="Notifikasi"></i>
      <div class="admin-profile">
        <i class="fa-solid fa-circle-user"></i>
        <span id="adminNameTop">Admin</span>
      </div>
    </div>
  </header>

  <!-- Sidebar + Konten Utama -->
  <div class="dashboard-wrapper">
    <aside class="sidebar" id="sidebarMenu">
      <a href="menu utama.html" class="nav-item active">Menu Utama</a>
      <a href="cetak nota.html" class="nav-item">Cetak Nota Terima</a>
      <a href="laporan keuangan.html" class="nav-item">Laporan Keuangan</a>
      <a href="laporan kinerja.html" class="nav-item">Laporan Kinerja</a>
      <a href="kasir.html" class="nav-item">Kasir</a>
      <a href="pengaturan.html" class="nav-item">Pengaturan</a>
      <a href="profil admin.html" class="nav-item">Profil Admin</a>
      <div class="menu-empty-info" id="menuEmptyInfo">Menu tidak ditemukan.</div>
    </aside>

    <main class="content-area">
      <div class="welcome-header">
        <h1>&#128075; Halo, <span id="adminGreeting">Admin</span> !</h1>
        <p>Selamat datang di panel admin Si Perbaiki</p>
      </div>

      <!-- 4 Kartu Ringkasan -->
      <section class="stats-grid" id="statsGrid"></section>

      <!-- 2 Grafik dengan Tulisan Langsung -->
      <section class="charts-grid">
        <!-- Grafik Batang Pesanan -->
        <div class="chart-card">
          <h2 class="chart-title">Grafik Pesanan</h2>
          <div class="svg-wrapper" id="barChartContainer"></div>
        </div>

        <!-- Grafik Donat Status Pesanan -->
        <div class="chart-card">
          <h2 class="chart-title">Status Pesanan</h2>
          <div class="svg-wrapper" id="donutChartContainer"></div>
          <div class="donut-legend" id="donutLegend"></div>
        </div>
      </section>
    </main>
  </div>

  <!-- Footer -->
  <footer class="footer">
    <span>&copy;Si Perbaiki. All Rights Reserved.</span>
    <span>Admin Dashboard v1.0</span>
  </footer>

  <script>
    const savedAdmin = localStorage.getItem("siPerbaikiAdmin");
    if (savedAdmin && savedAdmin.trim() !== "") {
      document.getElementById("adminNameTop").textContent = savedAdmin;
      document.getElementById("adminGreeting").textContent = savedAdmin;
    }
    
    // 2. Pencarian Menu pada Sidebar lewat Kotak Pencarian Navbar
    const menuSearchInput = document.getElementById("menuSearchInput");
    const navItems = document.querySelectorAll("#sidebarMenu .nav-item");
    const menuEmptyInfo = document.getElementById("menuEmptyInfo");

    menuSearchInput.addEventListener("input", function () {
      const keyword = menuSearchInput.value.trim().toLowerCase();
      let jumlahCocok = 0;

      navItems.forEach(function (link) {
        const namaMenu = link.textContent.toLowerCase();
        if (namaMenu.includes(keyword)) {
          link.style.display = "block";
          jumlahCocok++;
        } else {
          link.style.display = "none";
        }
      });

      menuEmptyInfo.style.display = jumlahCocok === 0 ? "block" : "none";
    });

    // Tekan Enter pada pencarian langsung membuka menu pertama yang cocok
    menuSearchInput.addEventListener("keydown", function (event) {
      if (event.key === "Enter") {
        event.preventDefault();
        for (let i = 0; i < navItems.length; i++) {
          if (navItems[i].style.display !== "none") {
            window.location.href = navItems[i].getAttribute("href");
            break;
          }
        }
      }
    });

    // 3. Data & Render 4 Kartu Statistik
    const dataKartu = [
      { label: "Pesanan Baru", jumlah: 12, ikon: "fa-solid fa-inbox" },
      { label: "Dalam Proses", jumlah: 8, ikon: "fa-solid fa-clock-rotate-left" },
      { label: "Dalam Peninjauan", jumlah: 3, ikon: "fa-solid fa-clipboard-check" },
      { label: "Selesai", jumlah: 25, ikon: "fa-solid fa-circle-check" }
    ];

    const statsGrid = document.getElementById("statsGrid");
    dataKartu.forEach(function (item) {
      statsGrid.innerHTML +=
        '<div class="stat-card">' +
          '<div class="stat-icon"><i class="' + item.ikon + '"></i></div>' +
          '<div class="stat-info">' +
            '<div class="stat-label">' + item.label + '</div>' +
            '<div class="stat-value">' + item.jumlah + '</div>' +
          '</div>' +
        '</div>';
    });

    // 4. Grafik Batang "Grafik Pesanan" dengan Label Angka Langsung di Atas Batang
    const dataHarian = [
      { hari: "Senin", nilai: 30 },
      { hari: "Selasa", nilai: 20 },
      { hari: "Rabu", nilai: 25 },
      { hari: "Kamis", nilai: 23 },
      { hari: "Jumat", nilai: 35 },
      { hari: "Sabtu", nilai: 50 },
      { hari: "Minggu", nilai: 35 }
    ];

    function renderBarChart() {
      const width = 460;
      const height = 270;
      const padLeft = 36;
      const padRight = 16;
      const padTop = 26;
      const padBottom = 34;
      const plotW = width - padLeft - padRight;
      const plotH = height - padTop - padBottom;
      const maxVal = 50;

      let svg = '<svg viewBox="0 0 ' + width + ' ' + height + '" xmlns="http://www.w3.org/2000/svg">';

      // Garis bantu horizontal & angka sumbu Y (0 - 50)
      for (let v = 0; v <= maxVal; v += 10) {
        const y = padTop + plotH - (v / maxVal) * plotH;
        svg += '<line x1="' + padLeft + '" y1="' + y + '" x2="' + (width - padRight) + '" y2="' + y + '" stroke="#e2e8f0" stroke-dasharray="3,3" />';
        svg += '<text x="' + (padLeft - 8) + '" y="' + (y + 4) + '" text-anchor="end" font-size="11" fill="#64748b">' + v + '</text>';
      }

      const slotW = plotW / dataHarian.length;
      const barW = Math.min(34, slotW * 0.58);

      dataHarian.forEach(function (d, i) {
        const barH = (d.nilai / maxVal) * plotH;
        const x = padLeft + i * slotW + (slotW - barW) / 2;
        const y = padTop + plotH - barH;
        const centerX = x + barW / 2;

        // Batang grafik
        svg += '<rect x="' + x + '" y="' + y + '" width="' + barW + '" height="' + barH + '" rx="4" fill="#6366f1" />';
        // Tulisan angka langsung di atas batang
        svg += '<text x="' + centerX + '" y="' + (y - 6) + '" text-anchor="middle" font-size="11" font-weight="700" fill="#1e293b">' + d.nilai + '</text>';
        // Label hari di bawah batang
        svg += '<text x="' + centerX + '" y="' + (height - 10) + '" text-anchor="middle" font-size="11" fill="#475569">' + d.hari + '</text>';
      });

      svg += '</svg>';
      document.getElementById("barChartContainer").innerHTML = svg;
    }

    // 5. Grafik Donat "Status Pesanan" dengan Label Angka & Persen Langsung di Tiap Potongan
    const dataStatus = [
      { label: "Pesanan Baru", nilai: 12, warna: "#2563eb" },
      { label: "Dalam Proses", nilai: 8, warna: "#f97316" },
      { label: "Dalam Peninjauan", nilai: 3, warna: "#8b5cf6" },
      { label: "Selesai", nilai: 25, warna: "#10b981" }
    ];

    function polarToCartesian(cx, cy, r, angleDeg) {
      const rad = ((angleDeg - 90) * Math.PI) / 180;
      return {
        x: cx + r * Math.cos(rad),
        y: cy + r * Math.sin(rad)
      };
    }

    function createDonutSlice(cx, cy, rOuter, rInner, startAngle, endAngle) {
      const p1 = polarToCartesian(cx, cy, rOuter, startAngle);
      const p2 = polarToCartesian(cx, cy, rOuter, endAngle);
      const p3 = polarToCartesian(cx, cy, rInner, endAngle);
      const p4 = polarToCartesian(cx, cy, rInner, startAngle);
      const largeArc = endAngle - startAngle > 180 ? 1 : 0;

      return [
        "M", p1.x, p1.y,
        "A", rOuter, rOuter, 0, largeArc, 1, p2.x, p2.y,
        "L", p3.x, p3.y,
        "A", rInner, rInner, 0, largeArc, 0, p4.x, p4.y,
        "Z"
      ].join(" ");
    }

    function renderDonutChart() {
      const size = 270;
      const cx = size / 2;
      const cy = size / 2;
      const rOuter = 112;
      const rInner = 62;
      const rLabel = (rOuter + rInner) / 2;

      const total = dataStatus.reduce(function (sum, item) {
        return sum + item.nilai;
      }, 0);

      let currentAngle = 0;
      let svg = '<svg viewBox="0 0 ' + size + ' ' + size + '" xmlns="http://www.w3.org/2000/svg">';

      dataStatus.forEach(function (item) {
        const sliceAngle = (item.nilai / total) * 360;
        const endAngle = currentAngle + sliceAngle;
        const midAngle = currentAngle + sliceAngle / 2;
        const persen = ((item.nilai / total) * 100).toFixed(1) + "%";

        const pathD = createDonutSlice(cx, cy, rOuter, rInner, currentAngle + 0.8, endAngle - 0.8);
        svg += '<path d="' + pathD + '" fill="' + item.warna + '" />';

        // Posisi tulisan tepat di tengah tiap potongan donat
        const labelPos = polarToCartesian(cx, cy, rLabel, midAngle);
        svg +=
          '<text x="' + labelPos.x + '" y="' + (labelPos.y - 3) + '" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">' +
            item.nilai +
          '</text>' +
          '<text x="' + labelPos.x + '" y="' + (labelPos.y + 10) + '" text-anchor="middle" font-size="9" font-weight="600" fill="#f8fafc">' +
            persen +
          '</text>';

        currentAngle = endAngle;
      });

      // Total pesanan di tengah lingkaran donat
      svg +=
        '<text x="' + cx + '" y="' + (cy - 4) + '" text-anchor="middle" font-size="11" fill="#64748b">Total</text>' +
        '<text x="' + cx + '" y="' + (cy + 16) + '" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a">' + total + '</text>';

      svg += '</svg>';
      document.getElementById("donutChartContainer").innerHTML = svg;

      // Legenda warna di bawah donat
      const legendEl = document.getElementById("donutLegend");
      legendEl.innerHTML = "";
      dataStatus.forEach(function (item) {
        legendEl.innerHTML +=
          '<div class="legend-item">' +
            '<span class="legend-dot" style="background-color:' + item.warna + ';"></span>' +
            '<span>' + item.label + '</span>' +
          '</div>';
      });
    }

    renderBarChart();
    renderDonutChart();
  </script>
</body>
</html>
